# HaE 原生格式规则集（github.com/gh0stkey/HaE）。
# 本文件使用 HaE 的 rules/group/rule 结构：f_regex 为主正则（regexp2 编译，
# 支持前瞻/后顾/反向引用），s_regex 为二级正则（对提取结果复检/再提取），
# format 用 {N} 引用捕获组定义输出，loaded=false 关闭单条规则，
# sensitive=true 表示区分大小写（缺省 false，即忽略大小写）。
# scope/color 为 HaE 原生字段：scope 在本项目无意义被忽略，color 映射为严重级别；
# severity/category 为 JsOwl 扩展字段，显式声明时优先于 color 映射。
rules:
- group: PII
  rule:
  - name: 身份证号
    loaded: true
    f_regex: ((?<![0-9Xx])[1-9]\d{5}(?:18|19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[0-9Xx](?![0-9Xx]))
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: 邮箱地址
    loaded: true
    f_regex: (\b[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,6}\b)
    s_regex: (?i)^(?![A-Za-z0-9.-]+\.(?:png|jpe?g|gif|webp|svg|bmp|ico|css|avif|tiff?))(?![^@]*@[0-9.]+x$).+
    format: '{0}'
    color: green
    scope: response body
    engine: nfa
    sensitive: false
    severity: medium
  - name: MAC地址
    loaded: true
    f_regex: ((?<![0-9A-Fa-f])(?:[0-9A-Fa-f]{2}[:.-]){5}[0-9A-Fa-f]{2}(?![0-9A-Fa-f]))
    s_regex: ''
    format: '{0}'
    color: green
    scope: response body
    engine: nfa
    sensitive: false

- group: 网络信息
  rule:
  - name: 内网IP
    loaded: true
    f_regex: ((?<![0-9.])(?:(?:10|127\.[01])\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})(?![0-9.]))
    s_regex: ''
    format: '{0}'
    color: green
    scope: response body
    engine: nfa
    sensitive: false
  - name: URL内嵌账密
    loaded: true
    f_regex: >-
      ((?:[A-Za-z0-9._%-]{2,}@[A-Za-z0-9.-]+):(?:[^@\s'"]{2,})@)
    s_regex: ''
    format: '{0}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high

- group: 密钥凭证
  rule:
  - name: 硬编码Authorization头
    loaded: true
    f_regex: >-
      ((?:basic|bearer|token)\s+[A-Za-z0-9=+/_:.-]{16,})
    s_regex: ''
    format: '{0}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: 存储连接串
    loaded: true
    f_regex: >-
      ((?:AccountName|AccountKey|SharedAccessSignature)\s*[=:]\s*["']?(?:[\w+/=-]{10,}))
    s_regex: ''
    format: '{1}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: 腾讯云SecretId
    loaded: true
    f_regex: (\bAKID[A-Za-z0-9]{32,40}\b)
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
  - name: 腾讯云AppId与AppKey
    loaded: true
    f_regex: >-
      (\bappid\b["']?\s*[:=]\s*["']?(?:\d{6,12})["']?[^\n]{0,80}\bappkey\b["']?\s*[:=]\s*["']?(?:\w{16,}))
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: 钉钉机器人Webhook
    loaded: true
    f_regex: (https://oapi\.dingtalk\.com/robot/send\?access_token=[A-Za-z0-9]{20,})
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
  - name: 企业微信机器人Webhook
    loaded: true
    f_regex: (https://qyapi\.weixin\.qq\.com/cgi-bin/webhook/send\?key=[A-Za-z0-9-]{20,})
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
  - name: 飞书机器人Webhook
    loaded: true
    f_regex: (https://open\.feishu\.cn/open-apis/bot/[A-Za-z0-9]{8,}/[A-Za-z0-9]{8,})
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false

- group: 指纹暴露
  rule:
  - name: Shiro指纹
    loaded: true
    f_regex: (rememberMe=deleteMe)
    s_regex: ''
    format: '{0}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: medium
  - name: Druid控制台
    loaded: true
    f_regex: ((?i)(?:Druid Stat Index|druid/index\.html|/druid/login\.html))
    s_regex: ''
    format: '{0}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: medium
  - name: Vite开发模式残留
    loaded: true
    f_regex: ((?:/@vite/client|/@react-refresh|vite/dist/client))
    s_regex: ''
    format: '{0}'
    color: green
    scope: response body
    engine: nfa
    sensitive: false
