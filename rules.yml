# JsOwl external rule set.
# Patterns are adapted from 正则表达式总结报告.md for Go's RE2 engine.
# Unsupported lookarounds/backreferences were rewritten into RE2-compatible forms.
# engine: nfa 的规则由 regexp2 编译，可直接使用 HaE 风格的前瞻/后顾/反向引用。
include:
  - ./hae_rules.yml
disabled: []

custom:
  - id: url.api-call
    name: API request URL
    category: url
    severity: info
    pattern: >-
      (?i)(?:fetch|axios\.(?:get|post|put|delete|patch|request)|\$\s*\.\s*ajax)\s*\(\s*["']([^"']+)["']
    group: 1
    description: fetch、axios 与 jQuery Ajax 请求地址
    enabled: true

  - id: report.url.xhr-open
    name: XMLHttpRequest URL
    category: url
    severity: info
    pattern: >-
      (?i)\.open\s*\(\s*["'](?:GET|POST|PUT|DELETE|PATCH)["']\s*,\s*["']([^"']+)["']
    group: 1
    description: XMLHttpRequest.open 请求地址
    enabled: true

  - id: url.vue-route
    name: Vue router path
    category: url
    severity: info
    pattern: >-
      (?i)path\s*:\s*["']([a-zA-Z0-9_?=/.-]+)["'][\s\S]{0,40}component\s*:
    group: 1
    description: Vue Router 路径
    enabled: true

  - id: url.assignment
    name: URL assignment
    category: url
    severity: info
    pattern: >-
      (?i)(?:url|href|src)\s*[:=]\s*(?:[\w$.]+\s*\+\s*)?["']([^"']+)["']
    group: 1
    description: URL、href、src 赋值
    enabled: true

  - id: url.api-prefix
    name: API path prefix
    category: url
    severity: info
    pattern: >-
      (?:^|[\s"'`])(/(?:api|v[0-9]+|rest|graphql|ws)/[^\s"'<>{}|\\`\[\]]+)
    group: 1
    description: 常见 API 路径前缀
    enabled: true

  - id: url.path-variable
    name: Path variable
    category: url
    severity: info
    pattern: >-
      (?i)(?:path|route|uri|url|endpoint|baseURL|base_url|prefix|api_?path|api_?url|redirect|next|callback_?url|return_?url)\s*[:=]\s*["']([^"']*/[^"']*)["']
    group: 1
    description: 路径和 Base URL 变量
    enabled: true

  - id: url.static-resource
    name: Static resource
    category: url
    severity: info
    pattern: >-
      (?i)["']((?:\.\./|\./|/)?[\w./-]+\.(?:js|mjs|jsx|ts|tsx|json|xml|html?|css|map|wasm))["']
    group: 1
    description: JavaScript、Source Map 与静态资源路径
    enabled: true

  - id: report.url.http
    name: HTTP URL
    category: url
    severity: info
    pattern: >-
      https?://[A-Za-z0-9$_.+!*(),%:@&/?#~=-]+
    group: 0
    description: 完整 HTTP/HTTPS URL
    enabled: true

  - id: report.secret.generic-key-value
    name: Generic secret value
    category: sensitive
    severity: high
    pattern: >-
      (?i)(?:access|admin|api|debug|auth|authorization|gpg|ops|ray|deploy|s3|certificate|aws|app|application|docker|elastic|elasticsearch|secret)[_-]{0,5}(?:key|token|secret|secretkey|pass|password|sid|debug)\s*[:=]\s*["']?([^'"\s&,;]+)
    group: 1
    description: 常见敏感 Key-Value
    enabled: true

  - id: secret.credential
    name: Password or secret value
    category: sensitive
    severity: high
    pattern: >-
      (?i)(?:password|passwd|pass|pwd|secret|mima)\s*["']?\s*[:=]\s*["']?([^'"\s&,;}]+)
    group: 1
    description: 密码和 Secret 字段
    enabled: true

  - id: secret.aws-access-key
    name: AWS access key
    category: sensitive
    severity: critical
    pattern: >-
      \b(?:AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Za-z0-9]{16}\b
    group: 0
    description: AWS Access Key ID
    enabled: true

  - id: secret.alibaba-access-key
    name: Alibaba Cloud access key
    category: sensitive
    severity: critical
    pattern: >-
      \bLTAI[A-Za-z0-9]{12,20}\b
    group: 0
    description: 阿里云 Access Key ID
    enabled: true

  - id: report.secret.sonar-token
    name: SonarQube token
    category: sensitive
    severity: critical
    pattern: >-
      (?i)sonar.{0,50}["'`]?([0-9a-f]{40})["'`]?
    group: 1
    description: SonarQube 40 位 Token
    enabled: true

  - id: secret.jwt
    name: JWT token
    category: sensitive
    severity: high
    pattern: >-
      ["'](ey[A-Za-z0-9_-]{10,}\.[A-Za-z0-9._-]{10,}\.[A-Za-z0-9._-]{10,})["']
    group: 1
    description: JSON Web Token
    enabled: true

  - id: secret.huawei-oss
    name: Huawei OSS credential
    category: sensitive
    severity: high
    pattern: >-
      (?i)huawei\.oss\.(?:ak|sk|bucket\.name|endpoint|local\.path)\s*[:=]\s*["']?([\w.-]+)
    group: 1
    description: 华为 OSS 配置值
    enabled: true

  - id: secret.jdbc
    name: JDBC connection string
    category: sensitive
    severity: high
    pattern: >-
      (?i)\bjdbc:[a-z0-9:]+://[A-Za-z0-9.\-_:;=/@?,&]+
    group: 0
    description: JDBC 数据库连接串
    enabled: true

  - id: secret.private-key-block
    name: Private key block
    category: sensitive
    severity: critical
    pattern: >-
      (?s)-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----
    group: 0
    description: PEM 私钥内容
    enabled: true

  - id: report.secret.openid-appsecret
    name: OpenID or AppSecret
    category: sensitive
    severity: critical
    pattern: >-
      (?i)["'](?:openid|appsecret)["']\s*:\s*["']([^"']+)["']
    group: 1
    description: OpenID 或 AppSecret 值
    enabled: true

  - id: report.secret.outlook-webhook
    name: Outlook webhook URL
    category: sensitive
    severity: critical
    pattern: >-
      https://outlook\.office\.com/webhook/[A-Za-z0-9@-]+[^\s"']*IncomingWebhook/[A-Za-z0-9-]+/[A-Za-z0-9-]+
    group: 0
    description: Outlook Incoming Webhook
    enabled: true

  - id: report.secret.s3-resource
    name: AWS S3 resource
    category: sensitive
    severity: medium
    pattern: >-
      (?i)(?:s3://[A-Za-z0-9._-]+|[A-Za-z0-9._-]+\.s3[.-][A-Za-z0-9._-]+|s3\.amazonaws\.com/[A-Za-z0-9._/-]+|s3\.console\.aws\.amazon\.com/s3/buckets/[A-Za-z0-9._-]+)
    group: 0
    description: S3 Bucket 或云资源地址
    enabled: true

  - id: report.secret.remember-me
    name: RememberMe value
    category: sensitive
    severity: medium
    pattern: >-
      (?i)(?:rememberMe)\s*=\s*([^&"\s]+)
    group: 1
    description: RememberMe 参数值
    enabled: true

  - id: report.secret.username
    name: Username value
    category: sensitive
    severity: medium
    pattern: >-
      (?i)(?:user|username|uname)\s*[:=]\s*["']?([^"',\s}]+)
    group: 1
    description: 用户名字段值
    enabled: true

  - id: pii.cn-mobile
    name: Chinese mobile number
    category: sensitive
    severity: medium
    pattern: >-
      \b1(?:3[0-9]|4[5-9]|5[0-35-9]|6[6]|7[0-8]|8[0-9]|9[0-9])[0-9]{8}\b
    group: 0
    description: 中国大陆手机号码
    enabled: true

  - id: report.sensitive.system-path
    name: System path
    category: sensitive
    severity: low
    pattern: >-
      (?:[A-Za-z]:(?:\\{1,2}[\w .-]+)+|/(?:bin|dev|home|media|opt|root|sbin|sys|usr|boot|data|etc|lib|mnt|proc|run|srv|tmp|var)(?:/[\w .-]+)*)
    group: 0
    description: Windows 或 Linux 系统路径
    enabled: true

  - id: report.sensitive.swagger
    name: Swagger exposure marker
    category: sensitive
    severity: low
    pattern: >-
      (?i)(?:swagger-ui\.html|["']swagger["']\s*:|Swagger UI|swaggerUi|swaggerVersion)
    group: 0
    description: Swagger UI 或版本标记
    enabled: true

  - id: report.sensitive.login-form
    name: Login form
    category: sensitive
    severity: low
    pattern: >-
      (?is)<form[^>]*>.*?type=["'](?:text|email)["'][^>]*>.*?type=["']password["'][^>]*>.*?</form>
    group: 0
    description: 包含用户名和密码输入框的表单
    enabled: true
