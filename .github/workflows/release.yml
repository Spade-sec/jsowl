# Release: push a v* tag to build CGO binaries for all supported platforms
# and attach them to a GitHub Release.
#
# Tree-sitter needs CGO, so plain GOOS/GOARCH cross-compilation is not enough:
# linux-arm64 uses the apt aarch64 cross gcc, and darwin-amd64 reuses the
# runner's Apple clang with -arch x86_64; everything else builds natively.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cross-prefix: aarch64-linux-gnu
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            cc-arch: x86_64
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install aarch64 cross toolchain
        if: matrix.cross-prefix
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu

      - name: Embed Windows icon
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          for dir in cmd/jsowl cmd/jsowl-mcp; do
            go run github.com/akavel/rsrc@v0.10.2 -arch "${{ matrix.goarch }}" \
              -ico img/jsowl.ico -o "${dir}/rsrc_windows_${{ matrix.goarch }}.syso"
          done

      - name: Build jsowl and jsowl-mcp
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [ -n "${{ matrix.cc-arch }}" ]; then
            CC="$(xcrun -f clang) -arch ${{ matrix.cc-arch }}"
          elif [ -n "${{ matrix.cross-prefix }}" ]; then
            CC="${{ matrix.cross-prefix }}-gcc"
          fi
          export CGO_ENABLED=1
          [ -n "${CC:-}" ] && export CC
          for bin in jsowl jsowl-mcp; do
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "dist/${bin}${{ matrix.ext }}" "./cmd/${bin}"
          done

      - name: Clean up icon resources
        shell: bash
        run: rm -f cmd/jsowl/rsrc_windows_*.syso cmd/jsowl-mcp/rsrc_windows_*.syso

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="jsowl_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${name}"
          cp dist/jsowl*${{ matrix.ext }} "dist/${name}/"
          cp README.md "dist/${name}/"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "${name}.zip" "${name}"
            rm -rf "${name}"
          else
            tar czf "${name}.tar.gz" "${name}"
            rm -rf "${name}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum --binary * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
