- group: PII
  rule:
  - name: 中国大陆手机号
    loaded: true
    f_regex: "\\b1(?:3[0-9]|4[5-9]|5[0-35-9]|6[6]|7[0-8]|8[0-9]|9[0-9])[0-9]{8}\\b"
