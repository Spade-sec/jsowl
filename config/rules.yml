  - name: OpenID 或 AppSecret
    loaded: true
    f_regex: "(?i)(?<![\\w$])[\"'`]?(?:openid|app[_-]?secret)[\"'`]?\\s*[:=]\\s*([\"'`])((?![^\"'`\\r\\n]{0,512}\\$\\{)(?!(?:null|undefined|true|false|none|changeme|change[_-]?me|placeholder|redacted|masked|example|sample|dummy|your[_-][\\w-]+|<[^\\r\\n]{0,128}>|\\*{3,}|x{3,}|\\.{3,}|%s|\\{\\{[^\\r\\n]{0,128}\\}\\}|(?:process\\.env|import\\.meta\\.env)(?:\\.[\\w$]+)?)\\1)[^\"'`\\r\\n]{1,512})\\1"
    s_regex: ''
    format: '{2}'
    color: red
