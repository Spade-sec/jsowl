# JsOwl 敏感信息与 URL 规则集（HaE 原生格式，github.com/gh0stkey/HaE）。
#
# 本文件是唯一规则来源，后续增删改规则只动这一个文件。它有三个作用：
# 1. 项目规则：在仓库目录（或任何包含 config/ 的目录）下运行 jsowl 时
#    自动加载，修改后立即生效，无需重新编译；
# 2. 嵌入默认值：编译时经 go:embed 嵌入二进制，供仓库外运行/首次运行
#    播种 ~/.jsowl/rules.yaml 使用；
# 3. 用户规则的底版：~/.jsowl/rules.yaml 由本文件播种生成，按自动生成的
#    规则 ID 覆盖默认条目。
#
# 加载优先级：rules_file（显式指定）> 本文件（项目级）>
# ~/.jsowl/rules.yaml（用户级）> 内嵌默认值。
#
# 结构为 HaE 的 rules/group/rule：f_regex 为主正则（regexp2 编译，支持
# 前瞻/后顾/反向引用），s_regex 为二级正则（对提取结果复检/再提取），
# format 用 {N} 引用捕获组定义输出，loaded=false 关闭单条规则，
# sensitive=true 表示区分大小写（缺省 false，即忽略大小写）。
# scope/color 为 HaE 原生字段：scope 在本项目无意义被忽略，color 映射为
# 严重级别；severity/category 为 JsOwl 扩展字段，显式声明时优先于 color。
#
# 说明：本文件的捕获组取值统一通过 format 指定（如 {1} 取第 1 组），因为
# HaE 解析固定以整段匹配（组 0）为提取值。规则 ID 由 组名/规则名 自动生成
# （hae.<组名>.<规则名>），disabled 列表按此 ID 寻址。
rules:
- group: 密钥凭证
  rule:
  - name: 云账号配置值
    loaded: true
    f_regex: "(?i)account[_-]?(?:name|key)?\\s*[:=]\\s*[\"']?([\\w-]+)"
    s_regex: ''
    format: '{1}'
    color: yellow
    scope: response body
    engine: nfa
    sensitive: false
    severity: medium
  - name: 私钥标识
    loaded: true
    f_regex: "(?i)private[_-]?key[_-]?(?:id)?\\s*[:=]\\s*[\"']?([\\w-]+)"
    s_regex: ''
    format: '{1}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: JWT token
    loaded: true
    f_regex: "[\"'](ey[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9._-]{10,}\\.[A-Za-z0-9._-]{10,})[\"']"
    s_regex: ''
    format: '{1}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: 凭据字段值
    loaded: true
    f_regex: "(?i)(?:password|username|access[_-]?key|access[_-]?token|secret|pwd)\\s*[:=]\\s*[\"']?([^\"',\\s]+)"
    s_regex: ''
    format: '{1}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: 华为OSS凭据
    loaded: true
    f_regex: "(?i)huawei\\.oss\\.(?:ak|sk|bucket\\.name|endpoint|local\\.path)\\s*[:=]\\s*[\"']?([\\w.-]+)"
    s_regex: ''
    format: '{1}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: AWS Access Key
    loaded: true
    f_regex: "\\b(?:AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Za-z0-9]{16}\\b"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: critical
  - name: 阿里云 Access Key
    loaded: true
    f_regex: "\\bLTAI[A-Za-z0-9]{12,20}\\b"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: critical
  - name: GitHub Token
    loaded: true
    f_regex: "\\b(?:ghp|ghu)_[A-Za-z0-9]{36}\\b"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: critical
  - name: Google OAuth Token
    loaded: true
    f_regex: "\\bya29\\.[0-9A-Za-z_-]+\\b"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: critical
  - name: PEM 私钥内容
    loaded: true
    f_regex: "(?s)-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: critical
  - name: JDBC 连接串
    loaded: true
    f_regex: "(?i)\\bjdbc:[a-z0-9]+://[a-z0-9._:@/?&=;-]+"
    s_regex: ''
    format: '{0}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: 通用敏感 Key-Value
    loaded: true
    f_regex: "(?i)(?:access|admin|api|debug|auth|authorization|gpg|ops|ray|deploy|s3|certificate|aws|app|application|docker|elastic|elasticsearch|secret)[_-]{0,5}(?:key|token|secret|secretkey|pass|password|sid|debug)\\s*[:=]\\s*[\"']?([^'\"\\s&,;]+)"
    s_regex: ''
    format: '{1}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: SonarQube Token
    loaded: true
    f_regex: "(?i)sonar.{0,50}[\"'`]?([0-9a-f]{40})[\"'`]?"
    s_regex: ''
    format: '{1}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: critical
  - name: OpenID 或 AppSecret
    loaded: true
    f_regex: "(?i)[\"'](?:openid|appsecret)[\"']\\s*:\\s*[\"']([^\"']+)[\"']"
    s_regex: ''
    format: '{1}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: critical
  - name: Outlook Webhook
    loaded: true
    f_regex: "https://outlook\\.office\\.com/webhook/[A-Za-z0-9@-]+[^\\s\"']*IncomingWebhook/[A-Za-z0-9-]+/[A-Za-z0-9-]+"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: critical
  - name: S3 云资源地址
    loaded: true
    f_regex: "(?i)(?:s3://[A-Za-z0-9._-]+|[A-Za-z0-9._-]+\\.s3[.-][A-Za-z0-9._-]+|s3\\.amazonaws\\.com/[A-Za-z0-9._/-]+|s3\\.console\\.aws\\.amazon\\.com/s3/buckets/[A-Za-z0-9._-]+)"
    s_regex: ''
    format: '{0}'
    color: yellow
    scope: response body
    engine: nfa
    sensitive: false
    severity: medium
  - name: RememberMe 参数值
    loaded: true
    f_regex: "(?i)(?:rememberMe)\\s*=\\s*([^&\"\\s]+)"
    s_regex: ''
    format: '{1}'
    color: yellow
    scope: response body
    engine: nfa
    sensitive: false
    severity: medium
  - name: 用户名字段值
    loaded: true
    f_regex: "(?i)(?:user|username|uname)\\s*[:=]\\s*[\"']?([^\"',\\s}]+)"
    s_regex: ''
    format: '{1}'
    color: yellow
    scope: response body
    engine: nfa
    sensitive: false
    severity: medium
  - name: 硬编码Authorization头
    loaded: true
    f_regex: "((?:basic|bearer|token)\\s+[A-Za-z0-9=+/_:.-]{16,})"
    s_regex: ''
    format: '{0}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: 存储连接串
    loaded: true
    f_regex: "((?:AccountName|AccountKey|SharedAccessSignature)\\s*[=:]\\s*[\"']?(?:[\\w+/=-]{10,}))"
    s_regex: ''
    format: '{1}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: 腾讯云SecretId
    loaded: true
    f_regex: "(\\bAKID[A-Za-z0-9]{32,40}\\b)"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
  - name: 腾讯云AppId与AppKey
    loaded: true
    f_regex: "(\\bappid\\b[\"']?\\s*[:=]\\s*[\"']?(?:\\d{6,12})[\"']?[^\\n]{0,80}\\bappkey\\b[\"']?\\s*[:=]\\s*[\"']?(?:\\w{16,}))"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: 钉钉机器人Webhook
    loaded: true
    f_regex: "(https://oapi\\.dingtalk\\.com/robot/send\\?access_token=[A-Za-z0-9]{20,})"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
  - name: 企业微信机器人Webhook
    loaded: true
    f_regex: "(https://qyapi\\.weixin\\.qq\\.com/cgi-bin/webhook/send\\?key=[A-Za-z0-9-]{20,})"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
  - name: 飞书机器人Webhook
    loaded: true
    f_regex: "(https://open\\.feishu\\.cn/open-apis/bot/[A-Za-z0-9]{8,}/[A-Za-z0-9]{8,})"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false

- group: PII
  rule:
  - name: 中国大陆手机号
    loaded: true
    f_regex: "\\b1(?:3[0-9]|4[5-9]|5[0-35-9]|6[6]|7[0-8]|8[0-9]|9[0-9])[0-9]{8}\\b"
    s_regex: ''
    format: '{0}'
    color: yellow
    scope: response body
    engine: nfa
    sensitive: false
    severity: medium
  - name: 身份证号
    loaded: true
    f_regex: "((?<![0-9Xx])[1-9]\\d{5}(?:18|19|20)\\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\\d|3[01])\\d{3}[0-9Xx](?![0-9Xx]))"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: 邮箱地址
    loaded: true
    f_regex: "(\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,6}\\b)"
    s_regex: (?i)^(?![A-Za-z0-9.-]+\.(?:png|jpe?g|gif|webp|svg|bmp|ico|css|avif|tiff?))(?![^@]*@[0-9.]+x$).+
    format: '{0}'
    color: green
    scope: response body
    engine: nfa
    sensitive: false
    severity: medium
  - name: MAC地址
    loaded: true
    f_regex: "((?<![0-9A-Fa-f])(?:[0-9A-Fa-f]{2}[:.-]){5}[0-9A-Fa-f]{2}(?![0-9A-Fa-f]))"
    s_regex: ''
    format: '{0}'
    color: green
    scope: response body
    engine: nfa
    sensitive: false

- group: 网络信息
  rule:
  - name: 内网IP
    loaded: true
    f_regex: "((?<![0-9.])(?:(?:10|127\\.[01])\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(?:1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3})(?![0-9.]))"
    s_regex: ''
    format: '{0}'
    color: green
    scope: response body
    engine: nfa
    sensitive: false
  - name: URL内嵌账密
    loaded: true
    f_regex: "((?:[A-Za-z0-9._%-]{2,}@[A-Za-z0-9.-]+):(?:[^@\\s'\"]{2,})@)"
    s_regex: ''
    format: '{0}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high

- group: 指纹暴露
  rule:
  - name: 系统路径
    loaded: true
    f_regex: "(?:[A-Za-z]:(?:\\\\{1,2}[\\w .-]+)+|/(?:bin|dev|home|media|opt|root|sbin|sys|usr|boot|data|etc|lib|mnt|proc|run|srv|tmp|var)(?:/[\\w .-]+)*)"
    s_regex: ''
    format: '{0}'
    color: green
    scope: response body
    engine: nfa
    sensitive: false
    severity: low
  - name: Swagger 暴露标记
    loaded: true
    f_regex: "(?i)(?:swagger-ui\\.html|[\"']swagger[\"']\\s*:|Swagger UI|swaggerUi|swaggerVersion)"
    s_regex: ''
    format: '{0}'
    color: green
    scope: response body
    engine: nfa
    sensitive: false
    severity: low
  - name: 登录表单
    loaded: true
    f_regex: "(?is)<form[^>]*>.*?type=[\"'](?:text|email)[\"'][^>]*>.*?type=[\"']password[\"'][^>]*>.*?</form>"
    s_regex: ''
    format: '{0}'
    color: green
    scope: response body
    engine: nfa
    sensitive: false
    severity: low
  - name: Shiro指纹
    loaded: true
    f_regex: "(rememberMe=deleteMe)"
    s_regex: ''
    format: '{0}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: medium
  - name: Druid控制台
    loaded: true
    f_regex: "((?i)(?:Druid Stat Index|druid/index\\.html|/druid/login\\.html))"
    s_regex: ''
    format: '{0}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: medium
  - name: Vite开发模式残留
    loaded: true
    f_regex: "((?:/@vite/client|/@react-refresh|vite/dist/client))"
    s_regex: ''
    format: '{0}'
    color: green
    scope: response body
    engine: nfa
    sensitive: false

- group: URL
  rule:
  - name: XMLHttpRequest URL
    loaded: true
    f_regex: "(?i)\\.open\\s*\\(\\s*[\"'](?:GET|POST|PUT|DELETE|PATCH)[\"']\\s*,\\s*[\"']([^\"']+)[\"']"
    s_regex: ''
    format: '{1}'
    color: blue
    scope: response body
    engine: nfa
    sensitive: false
    severity: info
    category: url
  - name: 完整 HTTP URL
    loaded: true
    f_regex: "https?://[A-Za-z0-9$_.+!*(),%:@&/?#~=-]+"
    s_regex: ''
    format: '{0}'
    color: blue
    scope: response body
    engine: nfa
    sensitive: false
    severity: info
    category: url
