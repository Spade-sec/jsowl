  - name: Outlook Webhook
    loaded: true
    f_regex: "https://outlook\\.office\\.com/webhook/[A-Za-z0-9@-]+[^\\s\"']*IncomingWebhook/[A-Za-z0-9-]+/[A-Za-z0-9-]+"
