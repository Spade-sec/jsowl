# JsOwl 敏感信息规则集（HaE 原生格式，github.com/gh0stkey/HaE）。
#
# 本文件是敏感信息规则的唯一来源；API/URL 提取由代码内置，不在此配置。
# 本文件有三个作用：
# 1. 项目规则：在仓库目录（或任何包含 config/ 的目录）下运行 jsowl 时
#    自动加载，修改后立即生效，无需重新编译；
# 2. 嵌入默认值：编译时经 go:embed 嵌入二进制，供仓库外运行/首次运行
#    播种 ~/.jsowl/rules.yaml 使用；
# 3. 用户规则的底版：~/.jsowl/rules.yaml 由本文件播种生成，按自动生成的
#    规则 ID 覆盖默认条目。
#
# 加载优先级：rules_file（显式指定）> 本文件（项目级）>
# ~/.jsowl/rules.yaml（用户级）> 内嵌默认值。
#
# 结构为 HaE 的 rules/group/rule：f_regex 为主正则（regexp2 编译，支持
# 前瞻/后顾/反向引用），s_regex 为二级正则（对提取结果复检/再提取），
# format 用 {N} 引用捕获组定义输出，loaded=false 关闭单条规则，
# sensitive=true 表示区分大小写（缺省 false，即忽略大小写）。
# scope/color 为 HaE 原生字段：scope 在本项目无意义被忽略，color 映射为
# 严重级别；severity/category 为 JsOwl 扩展字段，显式声明时优先于 color。
#
# 说明：本文件的捕获组取值统一通过 format 指定（如 {1} 取第 1 组），因为
# HaE 解析固定以整段匹配（组 0）为提取值。规则 ID 由 组名/规则名 自动生成
# （hae.<组名>.<规则名>），disabled 列表按此 ID 寻址。
rules:
- group: 密钥凭证
  rule:
  - name: 云账号配置值
    loaded: true
    f_regex: "(?i)(?<![\\w$])[\"'`]?(?:account(?:[_-]?(?:name|key|sid))?)[\"'`]?\\s*[:=]\\s*([\"'`])((?![^\"'`\\r\\n]{0,512}\\$\\{)(?!(?:null|undefined|true|false|none|changeme|change[_-]?me|placeholder|redacted|masked|example|sample|dummy|your[_-][\\w-]+|<[^\\r\\n]{0,128}>|\\*{3,}|x{3,}|\\.{3,}|%s|\\{\\{[^\\r\\n]{0,128}\\}\\}|(?:process\\.env|import\\.meta\\.env)(?:\\.[\\w$]+)?)\\1)[^\"'`\\r\\n]{1,512})\\1"
    s_regex: ''
    format: '{2}'
    color: yellow
    scope: response body
    engine: nfa
    sensitive: false
    severity: medium
  - name: 私钥标识
    loaded: true
    f_regex: "(?i)(?<![\\w$])[\"'`]?(?:private[_-]?key(?:[_-]?id)?)[\"'`]?\\s*[:=]\\s*([\"'`])((?![^\"'`\\r\\n]{0,512}\\$\\{)(?!(?:null|undefined|true|false|none|changeme|change[_-]?me|placeholder|redacted|masked|example|sample|dummy|your[_-][\\w-]+|<[^\\r\\n]{0,128}>|\\*{3,}|x{3,}|\\.{3,}|%s|\\{\\{[^\\r\\n]{0,128}\\}\\}|(?:process\\.env|import\\.meta\\.env)(?:\\.[\\w$]+)?)\\1)[^\"'`\\r\\n]{1,512})\\1"
    s_regex: ''
    format: '{2}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: JWT token
    loaded: true
    f_regex: "[\"'](ey[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9._-]{10,}\\.[A-Za-z0-9._-]{10,})[\"']"
    s_regex: ''
    format: '{1}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: 凭据字段值
    loaded: true
    f_regex: "(?i)(?<![\\w$])[\"'`]?(?:(?:[A-Za-z_$][\\w$]*[_-])?(?:password|passwd|pass|pwd|mima|username|(?:access|refresh|auth|id|session)[_-]?token|token|access[_-]?key(?:[_-]?(?:id|secret))?|access[_-]?secret|secret[_-]?(?:key|id)|secret))[\"'`]?\\s*[:=]\\s*([\"'`])((?![^\"'`\\r\\n]{0,512}\\$\\{)(?!(?:null|undefined|true|false|none|changeme|change[_-]?me|placeholder|redacted|masked|example|sample|dummy|your[_-][\\w-]+|<[^\\r\\n]{0,128}>|\\*{3,}|x{3,}|\\.{3,}|%s|\\{\\{[^\\r\\n]{0,128}\\}\\}|(?:process\\.env|import\\.meta\\.env)(?:\\.[\\w$]+)?)\\1)[^\"'`\\r\\n]{1,512})\\1"
    s_regex: ''
    format: '{2}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: 华为OSS凭据
    loaded: true
    f_regex: "(?i)(?<![\\w$])[\"'`]?(?:huawei\\.oss\\.(?:ak|sk|bucket\\.name|endpoint|local\\.path))[\"'`]?\\s*[:=]\\s*([\"'`])((?![^\"'`\\r\\n]{0,512}\\$\\{)(?!(?:null|undefined|true|false|none|changeme|change[_-]?me|placeholder|redacted|masked|example|sample|dummy|your[_-][\\w-]+|<[^\\r\\n]{0,128}>|\\*{3,}|x{3,}|\\.{3,}|%s|\\{\\{[^\\r\\n]{0,128}\\}\\}|(?:process\\.env|import\\.meta\\.env)(?:\\.[\\w$]+)?)\\1)[^\"'`\\r\\n]{1,512})\\1"
    s_regex: ''
    format: '{2}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: AWS Access Key
    loaded: true
    f_regex: "\\b(?:AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Za-z0-9]{16}\\b"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: critical
  - name: 阿里云 Access Key
    loaded: true
    f_regex: "\\bLTAI[A-Za-z0-9]{12,20}\\b"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: critical
  - name: GitHub Token
    loaded: true
    f_regex: "\\b(?:ghp|ghu)_[A-Za-z0-9]{36}\\b"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: critical
  - name: Google OAuth Token
    loaded: true
    f_regex: "\\bya29\\.[0-9A-Za-z_-]+\\b"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: critical
  - name: PEM 私钥内容
    loaded: true
    f_regex: "(?s)-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----"
    s_regex: ''
    format: '{0}'
    color: red
    scope: response body
    engine: nfa
    sensitive: false
    severity: critical
  - name: JDBC 连接串
    loaded: true
    f_regex: "(?i)\\bjdbc:(?:mysql|mariadb|postgresql|sqlserver|jtds:sqlserver|db2|oracle:(?:thin|oci)|h2|sqlite):(?![^\\s\"'`<>\\\\]{0,2048}\\$\\{)[^\\s\"'`<>\\\\]+"
    s_regex: ''
    format: '{0}'
    color: yellow
    scope: response body
    engine: nfa
    sensitive: false
    severity: medium
  - name: 数据库账密URI
    loaded: true
    f_regex: "(?i)(?<![\\w+.:\\-])(?:mysql2?|mariadb|postgres(?:ql)?|mongodb(?:\\+srv)?|rediss?|mssql|sqlserver|oracle)(?:\\+[a-z0-9_]+)?://(?![^\\s\"'`<>\\\\]{0,2048}\\$\\{)[^/\\s\"'`<>:@\\\\]*:[^/\\s\"'`<>@\\\\]+@[a-z0-9_\\[][^\\s\"'`<>\\\\]*"
    s_regex: ''
