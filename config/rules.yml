  - name: 数据库参数连接串
    loaded: true
    f_regex: "(?i)(?<![\\w$])(?![^\\r\\n\"'`]{0,2048}\\$\\{)(?:Server|Data\\s+Source|Host|Address|Addr|Network\\s+Address)\\s*=\\s*[^;\\r\\n\"'`]{1,256};(?=[^\\r\\n\"'`]{0,1024}\\b(?:Password|Pwd)\\s*=\\s*[^;\\s\"'`])(?=[^\\r\\n\"'`]{0,1024}\\b(?:Database|Initial\\s+Catalog|User\\s*ID|UID|Username)\\s*=)[^\\r\\n\"'`]{1,1024}"
    s_regex: ''
    format: '{0}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: MySQL Go DSN
    loaded: true
    f_regex: "(?<![\\w$])(?![^\\r\\n\"'`]{0,2048}\\$\\{)[^:\\s\"'`/@]+:[^@\\s\"'`]+@(?:tcp\\([^)\\r\\n]+\\)|unix\\([^)\\r\\n]+\\))/[^\\s\"'`<>]*"
    s_regex: ''
    format: '{0}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
