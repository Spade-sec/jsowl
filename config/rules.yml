    f_regex: "(?i)(?<![\\w$])[\"'`]?(?:user|username|uname)[\"'`]?\\s*[:=]\\s*([\"'`])((?![^\"'`\\r\\n]{0,512}\\$\\{)(?!(?:null|undefined|true|false|none|changeme|change[_-]?me|placeholder|redacted|masked|example|sample|dummy|your[_-][\\w-]+|<[^\\r\\n]{0,128}>|\\*{3,}|x{3,}|\\.{3,}|%s|\\{\\{[^\\r\\n]{0,128}\\}\\}|(?:process\\.env|import\\.meta\\.env)(?:\\.[\\w$]+)?)\\1)[^\"'`\\r\\n]{1,512})\\1"
    s_regex: ''
    format: '{2}'
    color: yellow
    scope: response body
    engine: nfa
    sensitive: false
    severity: medium
  - name: 硬编码Authorization头
    loaded: true
    f_regex: "((?:basic|bearer|token)\\s+[A-Za-z0-9=+/_:.-]{16,})"
    s_regex: ''
