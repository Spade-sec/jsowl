  - name: 通用敏感 Key-Value
    loaded: true
    f_regex: "(?i)(?<![\\w$])[\"'`]?(?:(?:access(?:[_-]?key)?[_-]?(?:id|secret)|secret[_-]?(?:key|id)|(?:access|admin|api|debug|auth|authorization|gpg|ops|ray|deploy|s3|certificate|aws|app|application|docker|es|elastic|elasticsearch|secret)[_-]{0,5}(?:key|token|secret|secretkey|pass|password|sid|debug)))[\"'`]?\\s*[:=]\\s*([\"'`])((?![^\"'`\\r\\n]{0,512}\\$\\{)(?!(?:null|undefined|true|false|none|changeme|change[_-]?me|placeholder|redacted|masked|example|sample|dummy|your[_-][\\w-]+|<[^\\r\\n]{0,128}>|\\*{3,}|x{3,}|\\.{3,}|%s|\\{\\{[^\\r\\n]{0,128}\\}\\}|(?:process\\.env|import\\.meta\\.env)(?:\\.[\\w$]+)?)\\1)[^\"'`\\r\\n]{1,512})\\1"
    s_regex: ''
    format: '{2}'
    color: orange
    scope: response body
    engine: nfa
    sensitive: false
    severity: high
  - name: SonarQube Token
    loaded: true
    f_regex: "(?i)sonar.{0,50}[\"'`]?([0-9a-f]{40})[\"'`]?"
