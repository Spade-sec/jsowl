mode: auto

request:
  timeout: 15s
  target_timeout: 5m
  retry: 1
  proxy: ""
  user_agent: ""
  headers: {}
  cookies: {}

browser:
  # 留空时只搜索已安装的本地 Chrome/Chromium，永不自动下载。
  path: ""
  # 页面 load 与网络空闲后，继续等待异步 JavaScript 的时间。
  wait: 3s
  idle: 800ms
  timeout: 45s
  headless: true
  # 仅在受限容器/靶场中 Chrome 沙箱无法启动时开启；默认保持 false。
  no_sandbox: false
  # 可覆盖为 collect_resource_urls.js 的绝对路径。
  collector_script: ""
  disable_injection: false

concurrency:
  targets: 4
  resources_per_target: 16

limits:
  max_depth: 5
  max_resources: 2000
  max_body_size: 10MiB

scope:
  allow_domains: []
  # 请求队列会忽略 URL path 以这些后缀结尾的资源；匹配忽略大小写和 query。
  suffix_blacklist:
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .webp
    - .svg
    - .ico
    - .bmp
    - .tif
    - .tiff
    - .woff
    - .woff2
    - .ttf
    - .otf
    - .eot
    - .mp3
    - .wav
    - .ogg
    - .flac
    - .mp4
    - .webm
    - .avi
    - .mov
    - .mkv
    - .zip
    - .rar
    - .7z
    - .tar
    - .gz
    - .bz2
    - .xz
    - .pdf
    - .wasm
    - .exe
    - .dll
    - .dmg
    - .iso
    - .css
  fetch_external_scripts: true
  probe_external_endpoints: false

output:
  directory: ./jsowl-report
  json: true
  html: true
  # 只保存普通 JavaScript 和 chunk；API 正文不会保存。
  # 默认开启：开启后会先把所有 JS 下载完成，再统一做正则匹配和 AST 解析。
  download_js: true
  js_directory: js

# 相对路径以本配置文件所在目录为基准。
rules_file: ./rules.yml
